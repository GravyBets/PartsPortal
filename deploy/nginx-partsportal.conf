# Include this file inside the existing nginx server block.

location = /partsportal/api {
    return 301 /partsportal/api/;
}

location /partsportal/api/ {
    proxy_pass http://127.0.0.1:5085/api/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /partsportal/install {
    return 301 /partsportal/install/;
}

location /partsportal/install/ {
    alias /var/www/partsportal/install/;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache";
}
