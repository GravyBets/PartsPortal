# Include this file inside the existing nginx server block.

location = /partsportal/api {
    return 301 /partsportal/api/;
}

location /partsportal/api/ {
    proxy_pass http://127.0.0.1:5085/api/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /partsportal/install {
    return 301 /partsportal/install/;
}

location /partsportal/install/ {
    root /var/www;
    index index.html;

    # ClickOnce deployment manifests need these MIME types.
    types {
        text/html html;
        application/x-ms-application application;
        application/x-ms-manifest manifest;
        application/octet-stream deploy;
        application/octet-stream exe;
    }

    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
}
